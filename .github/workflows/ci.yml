name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # Builds the packages, then every app: the demo and the starter are
      # prerendered and validated as part of their build.
      - run: pnpm build
      - name: Size and dependency budget
        run: pnpm --filter slidepig size
      - name: Image manifests are up to date
        run: pnpm --filter slidepig-demo assets:check
      - name: slidepig create produces a working project
        run: pnpm --filter slidepig smoke
